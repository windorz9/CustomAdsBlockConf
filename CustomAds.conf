# Quantumult X
# SMZDM startup ad blocking
# Test rule based on captured startup requests.

hostname = s3.zdmimg.com, us.l.qq.com

# 什么值得买：开屏广告
^https:\/\/s3\.zdmimg\.com\/cpm\/api\/v1\/advert_distribution\/get_all_advertise\?(?:[^&]*&)*zdm_template=cpm_iphone_homepage_0_open(?:&|$) url reject-dict

# 掌上英雄联盟：腾讯广告 SDK 开屏
^https:\/\/us\.l\.qq\.com\/exapp(?:\?|$) url reject-dict
